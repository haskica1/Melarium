<svg xmlns="http://www.w3.org/2000/svg" viewBox="82 86 332 332" role="img" aria-label="Melarium">
  <!-- Safari pinned-tab icon. This one must be a flat single-colour silhouette —
       Safari discards fills and recolours the whole shape from the `color` attribute
       on <link rel="mask-icon">, so the cell, the lattice and the abdomen bands from
       favicon.svg cannot survive here. What is left is the bee alone, on the same
       512 grid and with the same 12° tilt, with the viewBox cropped square around it. -->
  <g transform="rotate(-12 256 260)" fill="#000">
    <path d="M236,222 C214,194 176,168 152,178 C130,187 142,222 172,238 C198,252 228,246 236,222 Z" />
    <path d="M276,222 C298,194 336,168 360,178 C382,187 370,222 340,238 C314,252 284,246 276,222 Z" />
    <circle cx="256" cy="166" r="42" />
    <ellipse cx="256" cy="216" rx="50" ry="34" />
    <path d="M256,240 C304,240 324,282 324,322 C324,364 296,394 256,410
             C216,394 188,364 188,322 C188,282 208,240 256,240 Z" />
    <circle cx="216" cy="110" r="10" />
    <circle cx="296" cy="110" r="10" />
    <g stroke="#000" stroke-width="11" stroke-linecap="round" fill="none">
      <path d="M240,142 C230,126 224,118 218,111" />
      <path d="M272,142 C282,126 288,118 294,111" />
    </g>
  </g>
</svg>
